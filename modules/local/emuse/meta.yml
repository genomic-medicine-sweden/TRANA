name: "emuse"
description: Run emuse for generating reports from the TRANA 16S rRNA taxonomic profiling pipeline
keywords:
  - report
  - html
  - emuse
tools:
  - "emuse":
      description: "Report generator for the TRANA 16S rRNA taxonomic profiling pipeline"
      homepage: "https://github.com/kclinmicro/emuse"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          Requires `id` for --sample-name and `neg_control` for --neg-control.
    - input_dir:
        type: directory
        description: Directory containing input data for the EMUSE report

output:
  html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, including `id` and `neg_control`.
      - "*.html":
          type: file
          description: HTML report generated by EMUSE
          pattern: "*.html"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@rannick"
maintainers:
  - "@rannick"
